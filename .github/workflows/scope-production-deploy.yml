name: Scope CI and Production Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Component to validate and deploy
        type: choice
        default: all
        options:
          - all
          - checksImage
          - cache
          - worker
          - api
          - web
          - cli

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('scope-ci-pr-{0}', github.event.pull_request.number) || 'scope-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  packages: write

jobs:
  plan:
    name: Plan selected components
    runs-on: ubuntu-latest
    outputs:
      deployed_revisions: ${{ steps.progress.outputs.revisions }}
      checks_image: ${{ steps.plan.outputs.checks_image }}
      cache: ${{ steps.plan.outputs.cache }}
      worker: ${{ steps.plan.outputs.worker }}
      api: ${{ steps.plan.outputs.api }}
      web: ${{ steps.plan.outputs.web }}
      cli: ${{ steps.plan.outputs.cli }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read successful production revisions
        id: progress
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-deployment-progress.mjs read

      - name: Select affected components
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
          DEPLOYED_REVISIONS: ${{ steps.progress.outputs.revisions }}
        run: >-
          node .github/scripts/plan-production-deployment.mjs
          --manifest .github/deployment-services.json
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --scope "$REQUESTED_SCOPE"
          --deployed-revisions "$DEPLOYED_REVISIONS"

      - name: Test production deployment progress
        run: node --test .github/scripts/production-deployment-progress.test.mjs

      - name: Test deployment planner
        run: node --test .github/scripts/plan-production-deployment.test.mjs

      - name: Check Rust toolchain replicas
        run: node .github/scripts/check-rust-toolchain-sync.mjs

      - name: Test Rust toolchain replica checker
        run: node --test .github/scripts/check-rust-toolchain-sync.test.mjs

  checks-image:
    name: Checks image
    needs: plan
    if: needs.plan.outputs.checks_image == 'true'
    uses: ./.github/workflows/scope-checks-image.yml
    with:
      publish: ${{ github.event_name != 'pull_request' }}
      source_sha: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.scope == 'checksImage' && github.sha || '' }}
    secrets: inherit

  staging-proof:
    name: Railway staging proof
    needs: checks-image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' &&
      inputs.scope == 'checksImage' &&
      needs.checks-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted staging proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          run_title="Scope staging $SOURCE_SHA"
          seen_run_ids="$(
            gh run list \
              --workflow scope-railway-staging.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle \
              | jq -c --arg title "$run_title" \
                '[.[] | select(.displayTitle == $title) | .databaseId]'
          )"
          gh workflow run scope-railway-staging.yml --ref main -f source_sha="$SOURCE_SHA"
          for _ in {1..60}; do
            run_id="$(
              gh run list \
                --workflow scope-railway-staging.yml \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle \
                | jq -r --arg title "$run_title" --argjson seen "$seen_run_ids" \
                  '.[] | select(.displayTitle == $title) | select(.databaseId as $id | $seen | index($id) | not) | .databaseId' \
                | head -n 1 \
                || true
            )"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status
              exit
            fi
            sleep 5
          done
          echo "Timed out locating the trusted staging proof for $SOURCE_SHA." >&2
          exit 1

  backend:
    name: Backend
    needs: [plan, checks-image]
    if: >-
      always() &&
      (needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.api == 'true') &&
      (needs.checks-image.result == 'success' || needs.checks-image.result == 'skipped')
    uses: ./.github/workflows/scope-api-ci.yml
    with:
      deploy_cache: ${{ github.event_name != 'pull_request' && needs.plan.outputs.cache == 'true' }}
      deploy_worker: ${{ github.event_name != 'pull_request' && needs.plan.outputs.worker == 'true' }}
      deploy_api: ${{ github.event_name != 'pull_request' && needs.plan.outputs.api == 'true' }}
      successful_deployment_revisions: ${{ needs.plan.outputs.deployed_revisions || '{}' }}
    secrets: inherit

  web-independent:
    name: Web
    needs: plan
    if: >-
      needs.plan.outputs.web == 'true' &&
      needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.api != 'true'
    uses: ./.github/workflows/scope-web-ci.yml
    with:
      deploy: ${{ github.event_name != 'pull_request' }}
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').web || '' }}
    secrets: inherit

  web-after-backend:
    name: Web after backend
    needs: [plan, backend]
    if: >-
      always() && needs.plan.outputs.web == 'true' &&
      (needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.api == 'true') &&
      needs.backend.result == 'success'
    uses: ./.github/workflows/scope-web-ci.yml
    with:
      deploy: ${{ github.event_name != 'pull_request' }}
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').web || '' }}
    secrets: inherit

  cli-independent:
    name: CLI
    needs: plan
    if: >-
      needs.plan.outputs.cli == 'true' &&
      needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.api != 'true'
    uses: ./.github/workflows/scope-cli-build.yml
    with:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').cli || '' }}
      validate_targets: >-
        ${{ github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') }}
    secrets: inherit

  cli-after-backend:
    name: CLI after backend
    needs: [plan, backend]
    if: >-
      always() && needs.plan.outputs.cli == 'true' &&
      (needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.api == 'true') &&
      needs.backend.result == 'success'
    uses: ./.github/workflows/scope-cli-build.yml
    with:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').cli || '' }}
      validate_targets: >-
        ${{ github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') }}
    secrets: inherit
