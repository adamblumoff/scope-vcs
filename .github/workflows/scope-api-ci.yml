name: Scope Backend CI

on:
  pull_request:
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/scripts/deploy-backend-railway.sh"
      - ".github/scripts/test-deploy-backend-railway.sh"
      - ".github/workflows/scope-api-ci.yml"
      - ".github/workflows/rust-workspace-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "crates/**"
      - "worker/**"
      - "web/scripts/check-api-contract.mjs"
      - "web/src/api/types.generated.ts"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/scripts/deploy-backend-railway.sh"
      - ".github/scripts/test-deploy-backend-railway.sh"
      - ".github/workflows/scope-api-ci.yml"
      - ".github/workflows/rust-workspace-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "crates/**"
      - "worker/**"
      - "web/scripts/check-api-contract.mjs"
      - "web/src/api/types.generated.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-workspace-checks.yml
    with:
      include_api: true

  deployment-tests:
    name: Check backend deployment cutover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test Railway cutover orchestration
        run: bash .github/scripts/test-deploy-backend-railway.sh

  deploy-backend:
    name: Deploy backend
    needs: [checks, deployment-tests]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-backend-deploy-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-deploy-cargo-${{ hashFiles('Cargo.lock') }}
            ${{ runner.os }}-backend-deploy-cargo-

      - name: Build maintenance command
        run: cargo build --release --locked -p api --bin scope-maintenance

      - name: Stage Railway upload roots
        shell: bash
        run: |
          rm -rf .railway-upload
          for service in api worker; do
            root=".railway-upload/$service"
            mkdir -p "$root"
            cp Cargo.toml Cargo.lock rust-toolchain.toml "$root/"
            cp "$service/railpack.json" "$root/railpack.json"
            cp "$service/railway.json" "$root/railway.json"
            cp -a api "$root/api"
            cp -a worker "$root/worker"
            cp -a crates "$root/crates"
          done

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Deploy to Railway
        shell: bash
        env:
          RAILWAY_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: 45dd67fa-6d69-48ad-9680-1313d41b4490
          SCOPE_RAILWAY_ENVIRONMENT_ID: 2f21f6b6-6817-4338-9e08-cf18e78b8f46
          SCOPE_RAILWAY_API_SERVICE_ID: 9456cd8d-40bd-489a-a181-72b7f777c4a8
          SCOPE_RAILWAY_WORKER_SERVICE_ID: a474a0d1-3000-4a95-9ca3-cd3a7f3ef669
          SCOPE_RAILWAY_DATABASE_SERVICE_ID: 44c41a90-2d1a-4a1b-85c9-6af85d179be3
          SCOPE_RAILWAY_REGION_ID: us-east4-eqdc4a
          SCOPE_RAILWAY_API_REPLICAS: 1
          SCOPE_RAILWAY_WORKER_REPLICAS: 1
        run: bash .github/scripts/deploy-backend-railway.sh .railway-upload/api .railway-upload/worker
