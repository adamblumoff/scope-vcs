name: Scope Backend CI

on:
  pull_request:
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/scripts/verify-runner-cutover.sh"
      - ".github/scripts/deploy-backend-railway.sh"
      - ".github/scripts/test-deploy-backend-railway.sh"
      - ".github/workflows/scope-api-ci.yml"
      - ".github/workflows/rust-workspace-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "crates/**"
      - "worker/**"
      - "web/scripts/check-api-contract.mjs"
      - "web/src/api/types.generated.ts"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/scripts/verify-runner-cutover.sh"
      - ".github/scripts/deploy-backend-railway.sh"
      - ".github/scripts/test-deploy-backend-railway.sh"
      - ".github/workflows/scope-api-ci.yml"
      - ".github/workflows/rust-workspace-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "crates/**"
      - "worker/**"
      - "web/scripts/check-api-contract.mjs"
      - "web/src/api/types.generated.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-workspace-checks.yml
    with:
      include_api: true

  deployment-tests:
    name: Check backend deployment cutover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test Railway cutover orchestration
        run: bash .github/scripts/test-deploy-backend-railway.sh

  railway-auth-smoke:
    name: Smoke-test Railway workspace auth
    if: github.event_name == 'pull_request' && github.head_ref == 'railway-token-smoke-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.23.1

      - name: Scale, redeploy, and verify disposable service
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: 45dd67fa-6d69-48ad-9680-1313d41b4490
          RAILWAY_ENVIRONMENT_ID: 4de31334-3999-4f2a-b471-7b1f74c0fb18
          RAILWAY_SERVICE_ID: 987cf625-24a5-4c07-a24a-9bd4a3342031
        run: |
          set -euo pipefail
          scope=(--project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID")
          cleanup() {
            railway service scale "${scope[@]}" --service "$RAILWAY_SERVICE_ID" --json us-east4-eqdc4a=0 || true
          }
          trap cleanup EXIT

          wait_for_replicas() {
            local expected="$1" deadline=$((SECONDS + 300)) services_json running crashed
            while (( SECONDS < deadline )); do
              services_json="$(railway service list "${scope[@]}" --json)"
              read -r running crashed < <(
                SERVICES_JSON="$services_json" SERVICE_ID="$RAILWAY_SERVICE_ID" node -e '
const services = JSON.parse(process.env.SERVICES_JSON || "[]");
const service = services.find(({id}) => id === process.env.SERVICE_ID);
if (!service) process.exit(1);
process.stdout.write(`${service.replicas?.running || 0} ${service.replicas?.crashed || 0}`);
'
              )
              if [[ "$running" == "$expected" && "$crashed" == "0" ]]; then return 0; fi
              sleep 5
            done
            return 1
          }

          wait_for_deployment() {
            local deployment_id="$1" deadline=$((SECONDS + 600)) deployments_json status
            while (( SECONDS < deadline )); do
              deployments_json="$(railway deployment list "${scope[@]}" --service "$RAILWAY_SERVICE_ID" --limit 10 --json)"
              status="$(
                DEPLOYMENTS_JSON="$deployments_json" DEPLOYMENT_ID="$deployment_id" node -e '
const deployments = JSON.parse(process.env.DEPLOYMENTS_JSON || "[]");
process.stdout.write(deployments.find(({id}) => id === process.env.DEPLOYMENT_ID)?.status || "");
'
              )"
              case "$status" in
                SUCCESS) return 0 ;;
                FAILED|CRASHED|REMOVED) return 1 ;;
              esac
              sleep 5
            done
            return 1
          }

          wait_for_replicas 1
          railway service scale "${scope[@]}" --service "$RAILWAY_SERVICE_ID" --json us-east4-eqdc4a=0
          wait_for_replicas 0
          railway service scale "${scope[@]}" --service "$RAILWAY_SERVICE_ID" --json us-east4-eqdc4a=1
          wait_for_replicas 1
          redeploy_json="$(railway redeploy "${scope[@]}" --service "$RAILWAY_SERVICE_ID" --yes --json)"
          deployment_id="$(REDEPLOY_JSON="$redeploy_json" node -e 'const value = JSON.parse(process.env.REDEPLOY_JSON || "{}"); process.stdout.write(value.deploymentId || value.id || "");')"
          [[ -n "$deployment_id" ]]
          wait_for_deployment "$deployment_id"
          echo "Workspace token scaled and redeployed the disposable service successfully."

  deploy-backend:
    name: Deploy backend
    needs: [checks, deployment-tests]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-backend-deploy-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-deploy-cargo-${{ hashFiles('Cargo.lock') }}
            ${{ runner.os }}-backend-deploy-cargo-

      - name: Build maintenance command
        run: cargo build --release --locked -p api --bin scope-maintenance

      - name: Stage Railway upload roots
        shell: bash
        run: |
          rm -rf .railway-upload
          for service in api worker; do
            root=".railway-upload/$service"
            mkdir -p "$root"
            cp Cargo.toml Cargo.lock rust-toolchain.toml "$root/"
            cp "$service/railpack.json" "$root/railpack.json"
            cp "$service/railway.json" "$root/railway.json"
            cp -a api "$root/api"
            cp -a worker "$root/worker"
            cp -a crates "$root/crates"
          done

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.23.1

      - name: Deploy to Railway
        shell: bash
        env:
          RAILWAY_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: 45dd67fa-6d69-48ad-9680-1313d41b4490
          SCOPE_RAILWAY_WORKSPACE_ID: 746a91f2-86c3-4caf-88d8-d773871b46d3
          SCOPE_RAILWAY_ENVIRONMENT_ID: 2f21f6b6-6817-4338-9e08-cf18e78b8f46
          SCOPE_RAILWAY_API_SERVICE_ID: 9456cd8d-40bd-489a-a181-72b7f777c4a8
          SCOPE_RAILWAY_WORKER_SERVICE_ID: a474a0d1-3000-4a95-9ca3-cd3a7f3ef669
          SCOPE_RAILWAY_DATABASE_SERVICE_ID: 44c41a90-2d1a-4a1b-85c9-6af85d179be3
          SCOPE_API_TOPOLOGY: us-west=1
          SCOPE_WORKER_TOPOLOGY: us-west=1
          SCOPE_RECOVER_CLOSED_CUTOVER: ${{ github.run_attempt > 1 && '1' || '0' }}
        run: bash .github/scripts/deploy-backend-railway.sh .railway-upload/api .railway-upload/worker

  verify-runner-cutover:
    name: Verify runner protocol cutover
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.23.1

      - name: Verify production runner cutover
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: 45dd67fa-6d69-48ad-9680-1313d41b4490
          SCOPE_RAILWAY_ENVIRONMENT_ID: 2f21f6b6-6817-4338-9e08-cf18e78b8f46
          SCOPE_RAILWAY_API_SERVICE_ID: 9456cd8d-40bd-489a-a181-72b7f777c4a8
        run: bash .github/scripts/verify-runner-cutover.sh
