name: Scope Backend CI

on:
  workflow_call:
    inputs:
      build_maintenance_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust-workspace-checks.yml
    with:
      include_api: true

  deployment-tests:
    name: Check backend deployment cutover
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test Railway cutover orchestration
        run: bash .github/scripts/test-deploy-backend-railway.sh

  maintenance-artifact:
    name: Build maintenance command
    if: inputs.build_maintenance_artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: backend-deploy
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Build maintenance command
        run: cargo build --release --locked -p api --bin scope-maintenance

      - name: Pack maintenance command
        run: |
          mkdir -p artifacts
          tar --create --gzip \
            --file artifacts/scope-maintenance.tar.gz \
            --directory target/release \
            scope-maintenance

      - name: Upload maintenance command
        uses: actions/upload-artifact@v7
        with:
          name: backend-maintenance-${{ github.sha }}
          path: artifacts/scope-maintenance.tar.gz
          if-no-files-found: error
