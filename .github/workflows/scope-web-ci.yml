name: Scope Web CI

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Check scope-web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test scope-web
        run: pnpm test

      - name: Type-check scope-web
        run: pnpm typecheck

      - name: Check React health
        run: pnpm check:react-doctor

      - name: Check web structure
        run: pnpm check:konsistent

      - name: Build scope-web
        run: pnpm build
