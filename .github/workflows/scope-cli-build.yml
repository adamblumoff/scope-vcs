name: Scope CLI Build

on:
  workflow_call:
    inputs:
      validate_targets:
        type: boolean
        default: false
      validate_service_release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare distribution matrix
    if: inputs.validate_targets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read distribution targets
        id: targets
        shell: bash
        run: |
          matrix="$(jq -c '{include: [.targets[] | {label, runner, target: .triple, artifact, binary, builder, smoke}]}' cli/distribution/targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    name: Check scope-cli
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: cli-checks
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: cli -> target

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --locked

      - name: Lint
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings

  service-release:
    name: Build scope-cli service
    if: inputs.validate_service_release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: cli-service-release
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: cli -> target

      - name: Build service
        run: >
          cargo build
          --manifest-path cli/Cargo.toml
          --release
          --locked
          --bin scope-cli-service

      - name: Pack service
        run: |
          mkdir -p artifacts
          tar --create --gzip \
            --file artifacts/scope-cli-service.tar.gz \
            --directory cli/target/release \
            scope-cli-service

      - name: Upload service
        uses: actions/upload-artifact@v7
        with:
          name: cli-service-release-${{ github.sha }}
          path: artifacts/scope-cli-service.tar.gz
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [checks, prepare]
    if: inputs.validate_targets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: ${{ matrix.builder == 'cross' }}
          shared-key: cli-build-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: cli -> target

      - name: Install cross
        if: matrix.builder == 'cross'
        working-directory: cli
        env:
          CARGO_TARGET_DIR: target/cargo-install
        run: cargo install cross --locked

      - name: Build scope
        working-directory: cli
        shell: bash
        env:
          SCOPE_BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --locked --target "${{ matrix.target }}" --bin scope
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin scope
          fi

      - name: Smoke test
        if: matrix.smoke
        working-directory: cli
        shell: bash
        run: ./${{ matrix.binary }} --help

      - name: Stage artifact
        working-directory: cli
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error
