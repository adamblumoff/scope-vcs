name: Scope CLI Build

on:
  pull_request:
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/workflows/scope-cli-build.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "cli/**"
      - "crates/**"
      - "dev/**"
      - "rust-toolchain.toml"
      - "web/src/api/types.generated.ts"
      - "worker/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/deploy-railway.sh"
      - ".github/workflows/scope-cli-build.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/**"
      - "cli/**"
      - "crates/**"
      - "dev/**"
      - "rust-toolchain.toml"
      - "web/src/api/types.generated.ts"
      - "worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare distribution matrix
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read distribution targets
        id: targets
        shell: bash
        run: |
          matrix="$(jq -c '{include: [.targets[] | {label, runner, target: .triple, artifact, binary, builder, smoke}]}' cli/distribution/targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    name: Check scope-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            cli/target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cli-cargo-${{ hashFiles('cli/Cargo.lock') }}
            ${{ runner.os }}-cli-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --locked

      - name: Lint
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build release binaries
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >
          cargo build
          --manifest-path cli/Cargo.toml
          --release
          --locked
          --bin scope
          --bin scope-cli-service

  build:
    name: Build ${{ matrix.label }}
    needs: [checks, prepare]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            cli/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('cli/Cargo.lock') }}
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.builder == 'cross'
        working-directory: cli
        env:
          CARGO_TARGET_DIR: target/cargo-install
        run: cargo install cross --locked

      - name: Build scope
        working-directory: cli
        shell: bash
        env:
          SCOPE_BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --locked --target "${{ matrix.target }}" --bin scope
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin scope
          fi

      - name: Smoke test
        if: matrix.smoke
        working-directory: cli
        shell: bash
        run: ./${{ matrix.binary }} --help

      - name: Stage artifact
        working-directory: cli
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error

  e2e:
    name: Two-actor contribution flow
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scope_dev
          POSTGRES_PASSWORD: scope
          POSTGRES_USER: scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope -d scope_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
            cli/target
          key: ${{ runner.os }}-cli-e2e-cargo-${{ hashFiles('Cargo.lock', 'cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cli-e2e-cargo-${{ hashFiles('Cargo.lock', 'cli/Cargo.lock') }}
            ${{ runner.os }}-cli-e2e-cargo-

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate
          pnpm install --frozen-lockfile

      - name: Configure isolated local stack
        shell: bash
        run: |
          clerk_host='scope-e2e.clerk.accounts.dev$'
          clerk_payload="$(printf '%s' "$clerk_host" | base64 | tr '/+' '_-' | tr -d '=\n')"
          printf '%s\n' \
            'DATABASE_URL=postgres://scope:scope@127.0.0.1:5432/scope_dev' \
            'SCOPE_DEV_USER_EMAIL=smoke@example.test' \
            'SCOPE_DEV_USER_HANDLE=dev' > .env.local
          printf 'VITE_CLERK_PUBLISHABLE_KEY=pk_test_%s\n' \
            "$clerk_payload" > web/.env.local

      - name: Prebuild local stack and CLI
        run: |
          cargo build -p api --features local-dev --locked
          cargo build -p worker --locked
          cargo build --manifest-path cli/Cargo.toml --locked --bin scope

      - name: Start seeded local stack
        env:
          SCOPE_DEV_HEADLESS_E2E: "1"
        run: ./dev/scope-dev up

      - name: Exercise the two-actor contribution flow
        env:
          SCOPE_API_URL: http://localhost:8080
          SCOPE_CLI_E2E: "1"
        run: >-
          cargo test
          --manifest-path cli/Cargo.toml
          --test contribution_flow
          --locked
          -- --nocapture

      - name: Print local stack logs
        if: failure()
        shell: bash
        run: |
          for log in .tmp/local-dev/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      - name: Stop local stack
        if: always()
        run: ./dev/scope-dev down

  deploy:
    name: Deploy scope-cli
    needs: [build, e2e]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: cli/dist
          merge-multiple: true

      - name: Verify artifacts and write checksums
        shell: bash
        run: |
          mapfile -t expected < <(jq -r '.targets[].artifact' cli/distribution/targets.json)

          for artifact in "${expected[@]}"; do
            test -s "cli/dist/$artifact"
          done

          (
            cd cli/dist
            for artifact in "${expected[@]}"; do
              sha256sum "$artifact" > "$artifact.sha256"
            done
          )

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Stage Railway upload root
        shell: bash
        run: |
          rm -rf .railway-upload
          mkdir -p .railway-upload/cli/crates
          cp -a cli/. .railway-upload/cli/
          cp rust-toolchain.toml .railway-upload/cli/rust-toolchain.toml
          cp -a crates/scope-api-contract .railway-upload/cli/crates/scope-api-contract
          cp -a crates/scope-domain .railway-upload/cli/crates/scope-domain
          perl -0pi -e 's#path = "\.\./crates/scope-api-contract"#path = "crates/scope-api-contract"#' .railway-upload/cli/Cargo.toml
          perl -0pi -e 's#path = "\.\./crates/scope-domain"#path = "crates/scope-domain"#' .railway-upload/cli/Cargo.toml
          grep -F 'path = "crates/scope-api-contract"' .railway-upload/cli/Cargo.toml
          grep -F 'path = "crates/scope-domain"' .railway-upload/cli/Cargo.toml
          test -s .railway-upload/cli/railpack.json
          test -s .railway-upload/cli/crates/scope-api-contract/Cargo.toml
          test -s .railway-upload/cli/crates/scope-domain/Cargo.toml
          test ! -e .railway-upload/Cargo.toml

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.23.1

      - name: Deploy artifacts to Railway
        shell: bash
        env:
          RAILWAY_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash .github/scripts/deploy-railway.sh scope-cli .railway-upload
