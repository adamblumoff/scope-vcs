name: Staging managed runner infrastructure experiment

on:
  push:
    branches:
      - experiment/ecs-managed-instances
    paths:
      - .github/workflows/staging-managed-runner-experiment.yml
      - deploy/aws/apply-cloud-runner.sh
      - deploy/aws/cloud-runner.yaml

concurrency:
  group: staging-managed-runner-infrastructure-experiment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Remove isolated staging stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure temporary AWS role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::957143340948:role/scope-staging-experiment-github-94d56973
          role-session-name: scope-staging-managed-runner-${{ github.run_id }}

      - name: Remove staging Managed Instances stack
        env:
          AWS_REGION: us-east-1
          STACK_NAME: scope-cloud-runner-staging-mi-experiment
        run: |
          set -euo pipefail
          dispatcher_user="${STACK_NAME}-railway-dispatcher"
          checks_repository="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ChecksImageRepositoryName'].OutputValue | [0]" \
            --output text)"

          for access_key_id in $(aws iam list-access-keys \
            --user-name "$dispatcher_user" \
            --query 'AccessKeyMetadata[].AccessKeyId' \
            --output text); do
            aws iam delete-access-key \
              --user-name "$dispatcher_user" \
              --access-key-id "$access_key_id"
          done

          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

          image_count="$(aws ecr describe-images \
            --repository-name "$checks_repository" \
            --query 'length(imageDetails)' \
            --output text)"
          test "$image_count" = "0"
          aws ecr delete-repository --repository-name "$checks_repository"

      - name: Remove temporary GitHub OIDC role
        env:
          ROLE_NAME: scope-staging-experiment-github-94d56973
        run: |
          set -euo pipefail
          for policy_arn in $(aws iam list-attached-role-policies \
            --role-name "$ROLE_NAME" \
            --query 'AttachedPolicies[].PolicyArn' \
            --output text); do
            aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$policy_arn"
          done
          for policy_name in $(aws iam list-role-policies \
            --role-name "$ROLE_NAME" \
            --query 'PolicyNames[]' \
            --output text); do
            aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$policy_name"
          done
          aws iam delete-role --role-name "$ROLE_NAME"
