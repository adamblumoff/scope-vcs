name: Scope AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      command:
        description: CloudFormation operation
        type: choice
        default: plan
        options:
          - validate
          - plan
          - apply
      change_set_arn:
        description: Exact change-set ARN to apply; leave empty to create a fresh plan
        type: string
        required: false

concurrency:
  group: scope-aws-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    name: ${{ inputs.command }} AWS infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.SCOPE_AWS_INFRASTRUCTURE_ROLE_ARN }}
          role-session-name: scope-aws-infrastructure-${{ github.run_id }}

      - name: Run CloudFormation operation
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          COMMAND: ${{ inputs.command }}
          SCOPE_REGISTRY_CREDENTIALS_SECRET_ARN: ${{ vars.SCOPE_REGISTRY_CREDENTIALS_SECRET_ARN }}
        run: deploy/aws/apply-cloud-runner.sh "$COMMAND" "$CHANGE_SET_ARN"
