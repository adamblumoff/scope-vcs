name: Scope Checks Image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      source_sha:
        type: string
        default: ""
    outputs:
      published_digest:
        value: ${{ jobs.build.outputs.published_digest }}
      published_image:
        value: ${{ jobs.build.outputs.published_image }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to publish as a candidate
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/checks

jobs:
  build:
    name: Build checks image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
    outputs:
      published_digest: ${{ steps.published.outputs.digest }}
      published_image: ${{ steps.published.outputs.image }}
    steps:
      - name: Resolve image source
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          source_sha="$EVENT_SHA"
          publish=false
          publish_main=false

          if [[ -n "$REQUESTED_SOURCE_SHA" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "source_sha is allowed only for a trusted manual run" >&2
              exit 1
            fi
            if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_sha must be a full lowercase 40-character commit SHA" >&2
              exit 1
            fi
            source_sha="$REQUESTED_SOURCE_SHA"
            publish=true
          elif [[ "$REQUESTED_PUBLISH" == "true" && "$EVENT_NAME" != "pull_request" && "$GIT_REF" == "refs/heads/main" ]]; then
            publish=true
            publish_main=true
          fi

          {
            echo "sha=$source_sha"
            echo "publish=$publish"
            echo "publish_main=$publish_main"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Verify checked out revision
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          PUBLISH_MAIN: ${{ steps.source.outputs.publish_main }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${SOURCE_SHA}"
            if [[ "$PUBLISH_MAIN" == "true" ]]; then
              echo "${IMAGE_NAME}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .scope/images/checks/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.source.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ steps.source.outputs.publish_main == 'true' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_NAME) || '' }}

      - name: Record published digest
        id: published
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test -n "$IMAGE_DIGEST"
          {
            echo "Published \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\nimage=%s@%s\n' "$SOURCE_SHA" "$IMAGE_NAME" "$IMAGE_DIGEST" > checks-image.txt

      - name: Upload published image reference
        if: steps.source.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checks-image-${{ steps.source.outputs.sha }}
          path: checks-image.txt
          if-no-files-found: error

      - name: Record successful production revision
        if: steps.source.outputs.publish_main == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          node .github/scripts/production-deployment-progress.mjs record
          --component checksImage
          --source-sha "$SOURCE_SHA"
          --provider ghcr
          --evidence-id "$IMAGE_DIGEST"
          --log-url "$LOG_URL"
