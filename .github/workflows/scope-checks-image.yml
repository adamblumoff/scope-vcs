name: Scope Checks Image

on:
  pull_request:
    paths:
      - ".github/workflows/scope-checks-image.yml"
      - ".scope/images/checks/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scope-checks-image.yml"
      - ".scope/images/checks/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/checks

jobs:
  build:
    name: Build checks image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published_digest: ${{ steps.published.outputs.digest }}
      published_image: ${{ steps.published.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .scope/images/checks
          file: .scope/images/checks/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digest
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "Published \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
