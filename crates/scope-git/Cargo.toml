[package]
name = "scope-git"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

[features]
default = ["storage"]
storage = ["dep:scope_object_store"]

[dependencies]
scope_domain = { package = "scope-domain", path = "../scope-domain" }
scope_object_store = { package = "scope-object-store", path = "../scope-object-store", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
thiserror = "2.0.18"
