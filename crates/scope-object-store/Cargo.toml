[package]
name = "scope-object-store"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

[features]
default = []
test-support = []

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "rustls-tls"] }
scope_domain = { package = "scope-domain", path = "../scope-domain" }
sha1 = "0.10.6"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
