[package]
name = "scope-postgres"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

[features]
default = []
local-dev = []
test-support = []

[dependencies]
anyhow = "1.0.100"
hex = "0.4.3"
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "mock", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha2 = "0.10.9"
scope_domain = { package = "scope-domain", path = "../scope-domain" }
scope_git = { package = "scope-git", path = "../scope-git", default-features = false }
scope_run_config = { package = "scope-run-config", path = "../scope-run-config" }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
