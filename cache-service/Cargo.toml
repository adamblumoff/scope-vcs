[package]
name = "scope-cache-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
getrandom.workspace = true
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
hex.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
scope_cache_contract.workspace = true
scope_cache_domain.workspace = true
scope_object_store.workspace = true
scope_postgres.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
scope_domain.workspace = true
scope_postgres = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tower = { workspace = true, features = ["util"] }
