[package]
name = "scope-cache-service"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
getrandom = "0.3.4"
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
scope_cache_contract = { package = "scope-cache-contract", path = "../crates/scope-cache-contract" }
scope_cache_domain = { package = "scope-cache-domain", path = "../crates/scope-cache-domain" }
scope_object_store = { package = "scope-object-store", path = "../crates/scope-object-store" }
scope_postgres = { package = "scope-postgres", path = "../crates/scope-postgres" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
base64 = "0.22.1"
scope_domain = { package = "scope-domain", path = "../crates/scope-domain" }
scope_postgres = { package = "scope-postgres", path = "../crates/scope-postgres", features = ["test-support"] }
sha2 = "0.10.9"
tower = { version = "0.5.3", features = ["util"] }
