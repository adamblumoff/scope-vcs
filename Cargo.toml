[workspace]
members = [
    "api",
    "cache-service",
    "crates/scope-api-contract",
    "crates/scope-cache-contract",
    "crates/scope-cache-domain",
    "crates/scope-content-lifecycle",
    "crates/scope-domain",
    "crates/scope-postgres",
    "crates/scope-git",
    "crates/scope-object-store",
    "crates/scope-git-process",
    "crates/scope-run-config",
    "runner-runtime",
    "worker",
]
exclude = ["cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

# scope-domain and scope-api-contract keep self-contained manifests because the
# standalone CLI release stages those two crates outside this workspace.
[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.12.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
libc = "0.2.177"
reqwest = { version = "0.12.26", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["formatting"] }
tokio = "1.48.0"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ts-rs = "12.0.1"

scope_api_contract = { package = "scope-api-contract", path = "crates/scope-api-contract" }
scope_cache_contract = { package = "scope-cache-contract", path = "crates/scope-cache-contract" }
scope_cache_domain = { package = "scope-cache-domain", path = "crates/scope-cache-domain" }
scope_content_lifecycle = { package = "scope-content-lifecycle", path = "crates/scope-content-lifecycle" }
scope_domain = { package = "scope-domain", path = "crates/scope-domain" }
scope_git = { package = "scope-git", path = "crates/scope-git", default-features = false }
scope_git_process = { package = "scope-git-process", path = "crates/scope-git-process" }
scope_object_store = { package = "scope-object-store", path = "crates/scope-object-store" }
scope_postgres = { package = "scope-postgres", path = "crates/scope-postgres" }
scope_run_config = { package = "scope-run-config", path = "crates/scope-run-config" }
