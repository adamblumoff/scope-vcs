name: Scope backend checks
on:
  manual: true
  push:
    branches:
      - main
runs-on: remote-linux
container:
  image: rust:1.94.0-bookworm
timeout: 45m
caches:
  - cargo
  - cargo-target
steps:
  - name: Install dependencies
    run: |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install --yes --no-install-recommends \
        curl \
        postgresql \
        postgresql-client \
        xz-utils

      curl --fail --silent --show-error \
        --retry 3 \
        --retry-all-errors \
        --retry-delay 2 \
        https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz \
        --output /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      node --version

      for attempt in 1 2 3; do
        if rustup component add \
          --toolchain 1.94.0-x86_64-unknown-linux-gnu \
          rustfmt \
          clippy
        then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep 5
      done
  - name: Check Rust workspace
    run: |
      service postgresql start
      su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN PASSWORD 'scope'\""
      su postgres -c "createdb --owner=scope scope_test"

      export CARGO_HOME=/scope/cache/cargo
      export CARGO_TARGET_DIR=/scope/cache/cargo-target
      export RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu
      export SCOPE_TEST_DATABASE_URL=postgres://scope:scope@127.0.0.1:5432/scope_test

      cargo fmt --all --check
      cargo test --workspace --features api/test-support --locked
      cargo test -p api --features local-dev --locked dev::
      cargo clippy --workspace --features api/test-support --all-targets --locked -- -D warnings
  - name: Check API TypeScript contract
    run: node web/scripts/check-api-contract.mjs
