name: Scope checks
on:
  manual: true
  push:
    branches:
      - main
container:
  image: ghcr.io/adamblumoff/scope-vcs/checks@sha256:4e531babd0365bc539cb604c922c0cc9e260334cae689b4daa6c5bf650b3e8da
timeout: 60m
caches: []
env:
  CARGO_HOME: /scope/cache/cargo
  CARGO_TARGET_DIR: /workspace/target
  RUSTUP_TOOLCHAIN: 1.98.0-x86_64-unknown-linux-gnu
jobs:
  backend:
    timeout: 45m
    caches:
      - name: cargo
        path: /scope/cache/cargo
        format: v1
        compatibility: &cargo-cache-compatibility
          files:
            - rust-toolchain.toml
          environment:
            - RUSTUP_TOOLCHAIN
            - CARGO_INCREMENTAL
            - CARGO_PROFILE_DEV_DEBUG
            - CARGO_PROFILE_TEST_DEBUG
          source: false
        exact: &root-cargo-cache-exact
          files: &root-cargo-cache-files
            - Cargo.lock
            - Cargo.toml
            - api/Cargo.toml
            - cache-service/Cargo.toml
            - crates/scope-api-contract/Cargo.toml
            - crates/scope-cache-contract/Cargo.toml
            - crates/scope-cache-domain/Cargo.toml
            - crates/scope-content-lifecycle/Cargo.toml
            - crates/scope-domain/Cargo.toml
            - crates/scope-git-process/Cargo.toml
            - crates/scope-git/Cargo.toml
            - crates/scope-object-store/Cargo.toml
            - crates/scope-postgres/Cargo.toml
            - crates/scope-run-config/Cargo.toml
            - runner-runtime/Cargo.toml
            - worker/Cargo.toml
          environment: []
          source: false
      - name: cargo-target
        path: /scope/cache/cargo-target
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: &root-cargo-target-cache-exact
          files: *root-cargo-cache-files
          environment: []
          source: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: /scope/cache/cargo-target
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
    steps:
      - name: Check Rust workspace
        run: |
          service postgresql start
          su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN PASSWORD 'scope'\""
          su postgres -c "createdb --owner=scope scope_test"
          cargo fmt --all --check
          cargo test --workspace --features api/test-support --locked
          cargo test -p api --features local-dev --locked dev::
          cargo clippy --workspace --features api/test-support --all-targets --locked -- -D warnings
      - name: Check API TypeScript contract
        run: node web/scripts/check-api-contract.mjs

  cli-checks:
    caches:
      - name: cargo
        path: /scope/cache/cargo
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: &cli-cargo-cache-exact
          files: &cli-cargo-cache-files
            - cli/Cargo.lock
            - cli/Cargo.toml
            - crates/scope-api-contract/Cargo.toml
            - crates/scope-domain/Cargo.toml
          environment: []
          source: false
      - name: cargo-target
        path: /scope/cache/cargo-target
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: &cli-cargo-target-cache-exact
          files: *cli-cargo-cache-files
          environment: []
          source: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: /scope/cache/cargo-target
    steps:
      - name: Check formatting
        run: |
          cargo fmt --manifest-path cli/Cargo.toml -- --check
      - name: Test
        run: |
          cargo test --manifest-path cli/Cargo.toml --locked
      - name: Lint
        run: |
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: |
          cargo build --manifest-path cli/Cargo.toml --release --locked \
              --bin scope --bin scope-cli-service

  cli-e2e:
    caches:
      - name: cargo
        path: /scope/cache/cargo
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: *cli-cargo-cache-exact
      - name: cargo-target
        path: /scope/cache/cargo-target
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: *cli-cargo-target-cache-exact
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: /scope/cache/cargo-target
    steps:
      - name: Two-actor contribution flow
        run: |
          cargo build --manifest-path cli/Cargo.toml --locked --bin scope
          ./dev/run-ci-local-stack cli env \
            SCOPE_API_URL=http://localhost:8080 \
            SCOPE_CLI_E2E=1 \
            cargo test --manifest-path cli/Cargo.toml --test contribution_flow --locked -- --nocapture

  web-checks:
    timeout: 45m
    caches:
      - name: pnpm-store
        path: /root/.local/share/pnpm/store
        format: v1
        compatibility: &pnpm-cache-compatibility
          files: []
          environment: []
          source: false
        exact: &pnpm-cache-exact
          files:
            - web/package.json
            - web/pnpm-lock.yaml
            - web/pnpm-workspace.yaml
          environment: []
          source: false
    steps:
      - name: Install dependencies
        run: (cd web && pnpm install --frozen-lockfile)
      - name: Test
        run: (cd web && pnpm test)
      - name: Check
        run: |
          (
            git config --global --add safe.directory "$PWD"
            git init --quiet .
            git add --all -- .gitignore web/src
            cd web
            pnpm check
          )
      - name: Build
        run: (cd web && pnpm build)

  web-smoke:
    timeout: 45m
    caches:
      - name: cargo
        path: /scope/cache/cargo
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: *root-cargo-cache-exact
      - name: cargo-target
        path: /scope/cache/cargo-target
        format: v1
        compatibility: *cargo-cache-compatibility
        exact: *root-cargo-target-cache-exact
      - name: pnpm-store
        path: /root/.local/share/pnpm/store
        format: v1
        compatibility: *pnpm-cache-compatibility
        exact: *pnpm-cache-exact
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: /scope/cache/cargo-target
    steps:
      - name: Install dependencies
        run: (cd web && pnpm install --frozen-lockfile)
      - name: Browser smoke against seeded local stack
        run: |
          ./dev/run-ci-local-stack web env \
            SCOPE_SMOKE_REPO=dev/public-demo \
            SCOPE_WEB_BASE_URL=http://localhost:3000 \
            sh -c 'cd web && pnpm test:smoke'
