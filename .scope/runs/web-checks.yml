name: Scope web checks
on:
  manual: true
  push:
    branches:
      - main
runs-on: remote-linux
container:
  image: rust:1.94.0-bookworm
timeout: 45m
caches:
  - cargo
  - cargo-target
  - pnpm-store
steps:
  - name: Install system dependencies
    run: |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install --yes --no-install-recommends \
        curl \
        iproute2 \
        postgresql \
        postgresql-client \
        xz-utils
  - name: Install Node
    run: |
      curl --fail --silent --show-error \
        --retry 3 \
        --retry-all-errors \
        --retry-delay 2 \
        https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz \
        --output /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      node --version
  - name: Enable pnpm
    run: |
      corepack enable
      for attempt in 1 2 3; do
        if corepack prepare pnpm@11.1.0 --activate; then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep 5
      done
  - name: Install Rust tooling
    run: |
      for attempt in 1 2 3; do
        if rustup component add \
          --toolchain 1.94.0-x86_64-unknown-linux-gnu \
          rustfmt \
          clippy
        then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep 5
      done
  - name: Install dependencies
    run: (cd web && pnpm install --frozen-lockfile --store-dir /scope/cache/pnpm-store)
  - name: Install Chromium
    run: (cd web && pnpm exec playwright install --with-deps chromium)
  - name: Test
    run: (cd web && pnpm test)
  - name: Check
    run: |
      (
        # React Doctor uses `git grep` for project-wide accessibility checks,
        # while Scope checks out a source snapshot without repository metadata.
        git config --global --add safe.directory "$PWD"
        git init --quiet .
        git add --all -- .gitignore web/src
        cd web
        export CARGO_HOME=/scope/cache/cargo
        export CARGO_TARGET_DIR=/scope/cache/cargo-target
        export RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu
        pnpm check
      )
  - name: Build
    run: (cd web && pnpm build)
  - name: Browser smoke against seeded local stack
    run: |
      service postgresql start
      su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN PASSWORD 'scope'\""
      su postgres -c "createdb --owner=scope scope_dev"

      clerk_host='scope-e2e.clerk.accounts.dev$'
      clerk_payload="$(printf '%s' "$clerk_host" | base64 | tr '/+' '_-' | tr -d '=\n')"
      printf '%s\n' \
        'DATABASE_URL=postgres://scope:scope@127.0.0.1:5432/scope_dev' \
        'SCOPE_DEV_USER_EMAIL=smoke@example.test' \
        'SCOPE_DEV_USER_HANDLE=dev' > .env.local
      printf 'VITE_CLERK_PUBLISHABLE_KEY=pk_test_%s\nCLERK_SECRET_KEY=sk_test_scope_e2e\n' \
        "$clerk_payload" > web/.env.local

      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build -p api --features local-dev --locked
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build -p worker --locked

      cleanup() {
        status="$?"
        if [ "$status" -ne 0 ]; then
          for log in .tmp/local-dev/*.log; do
            [ -f "$log" ] || continue
            printf '\n==> %s <==\n' "$log"
            tail -n 300 "$log"
          done
        fi
        ./dev/scope-dev down
        exit "$status"
      }
      trap cleanup EXIT
      # This public-only smoke test never grants an identity, so it does not
      # need a real Clerk instance or repository secrets.
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        VITE_SCOPE_WEB_FORCE_SIGNED_OUT=1 \
        ./dev/scope-dev up
      SCOPE_SMOKE_REPO=dev/public-demo \
        SCOPE_WEB_BASE_URL=http://localhost:3000 \
        sh -c 'cd web && pnpm test:smoke'
