name: Scope CLI checks
on:
  manual: true
  push:
    branches:
      - main
runs-on: remote-linux
container:
  image: rust:1.94.0-bookworm
timeout: 30m
steps:
  - name: Check formatting
    run: RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu cargo fmt --manifest-path cli/Cargo.toml -- --check
  - name: Test
    run: RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu cargo test --manifest-path cli/Cargo.toml --locked
  - name: Lint
    run: RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
  - name: Build release binaries
    run: |
      RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu cargo build \
        --manifest-path cli/Cargo.toml \
        --release \
        --locked \
        --bin scope \
        --bin scope-cli-service
