name: Scope CLI checks
on:
  manual: true
  push:
    branches:
      - main
runs-on: remote-linux
container:
  image: rust:1.94.0-bookworm
timeout: 60m
caches:
  - cargo
  - cargo-target
  - pnpm-store
steps:
  - name: Install integration dependencies
    run: |
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install --yes --no-install-recommends \
        curl \
        iproute2 \
        postgresql \
        postgresql-client \
        xz-utils

      curl --fail --silent --show-error \
        --retry 3 \
        --retry-all-errors \
        --retry-delay 2 \
        https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz \
        --output /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      corepack enable
      for attempt in 1 2 3; do
        if corepack prepare pnpm@11.1.0 --activate; then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep 5
      done
      (cd web && pnpm install --frozen-lockfile --store-dir /scope/cache/pnpm-store)
  - name: Install Rust tooling
    run: |
      for attempt in 1 2 3; do
        if rustup component add \
          rustfmt \
          clippy \
          --toolchain 1.94.0-x86_64-unknown-linux-gnu
        then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep 5
      done
  - name: Check formatting
    run: |
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo fmt --manifest-path cli/Cargo.toml -- --check
  - name: Test
    run: |
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo test --manifest-path cli/Cargo.toml --locked
  - name: Lint
    run: |
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
  - name: Build release binaries
    run: |
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build \
        --manifest-path cli/Cargo.toml \
        --release \
        --locked \
        --bin scope \
        --bin scope-cli-service
  - name: Two-actor contribution flow
    run: |
      service postgresql start
      su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN PASSWORD 'scope'\""
      su postgres -c "createdb --owner=scope scope_dev"

      clerk_host='scope-e2e.clerk.accounts.dev$'
      clerk_payload="$(printf '%s' "$clerk_host" | base64 | tr '/+' '_-' | tr -d '=\n')"
      printf '%s\n' \
        'DATABASE_URL=postgres://scope:scope@127.0.0.1:5432/scope_dev' \
        'SCOPE_DEV_USER_EMAIL=smoke@example.test' \
        'SCOPE_DEV_USER_HANDLE=dev' > .env.local
      printf 'VITE_CLERK_PUBLISHABLE_KEY=pk_test_%s\n' \
        "$clerk_payload" > web/.env.local

      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build -p api --features local-dev --locked
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build -p worker --locked
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        cargo build --manifest-path cli/Cargo.toml --locked --bin scope

      cleanup() {
        status="$?"
        if [ "$status" -ne 0 ]; then
          for log in .tmp/local-dev/*.log; do
            [ -f "$log" ] || continue
            printf '\n==> %s <==\n' "$log"
            tail -n 300 "$log"
          done
        fi
        ./dev/scope-dev down
        exit "$status"
      }
      trap cleanup EXIT
      SCOPE_DEV_HEADLESS_E2E=1 ./dev/scope-dev up
      CARGO_HOME=/scope/cache/cargo \
        CARGO_TARGET_DIR=/scope/cache/cargo-target \
        RUSTUP_TOOLCHAIN=1.94.0-x86_64-unknown-linux-gnu \
        SCOPE_API_URL=http://localhost:8080 \
        SCOPE_CLI_E2E=1 \
        cargo test \
          --manifest-path cli/Cargo.toml \
          --test contribution_flow \
          --locked \
          -- \
          --nocapture
