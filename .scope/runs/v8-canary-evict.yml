name: Runner protocol V8 eviction canary
on:
  manual: true
runs-on: remote-linux
container:
  image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
resources: { cpu: 1, memory: 1gb }
timeout: 5m
caches:
  - name: runner-protocol
    path: /scope/cache/runner-protocol
jobs:
  evict:
    steps:
      - name: Assert cache sentinel before eviction
        run: test "$(cat /scope/cache/runner-protocol/v8-canary-sentinel)" = 'scope-runner-protocol-v8'
