name: Runner protocol V4 cold-write canary
on:
  manual: true
runs-on: remote-linux
container:
  image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
timeout: 5m
caches:
  - runner-protocol
steps:
  - name: Write cache sentinel
    run: printf '%s' 'scope-runner-protocol-v4' > /scope/cache/runner-protocol/v4-canary-sentinel
