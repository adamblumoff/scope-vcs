[package]
name = "api"
version.workspace = true
edition.workspace = true
default-run = "api"
license.workspace = true
repository.workspace = true

[features]
default = []
local-dev = ["scope_postgres/local-dev"]
smoke-seed = ["scope_postgres/smoke-seed"]
test-support = ["scope_postgres/test-support", "scope_object_store/test-support"]
type-export = ["dep:ts-rs", "scope_api_contract/ts"]

[[bin]]
name = "export-api-types"
path = "src/bin/export_api_types.rs"
required-features = ["type-export"]

[[bin]]
name = "scope-maintenance"
path = "src/bin/scope_maintenance.rs"

[[bin]]
name = "scope-smoke-seed"
path = "src/bin/scope_smoke_seed.rs"
required-features = ["smoke-seed"]

[[test]]
name = "workflows"
path = "tests/workflows.rs"
required-features = ["test-support"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
flate2 = "1.1"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
hex.workspace = true
hmac.workspace = true
http = "1.4.0"
jsonwebtoken.workspace = true
getrandom.workspace = true
libc.workspace = true
posthog-rs = { version = "0.24.0", default-features = false, features = ["async-client"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
scope_postgres.workspace = true
scope_domain.workspace = true
scope_api_contract.workspace = true
scope_cache_contract.workspace = true
scope_cache_domain.workspace = true
scope_content_lifecycle.workspace = true
scope_git = { workspace = true, features = ["storage"] }
scope_git_storage.workspace = true
scope_run_config.workspace = true
scope_object_store.workspace = true
url = "2.5.7"
scope_git_process.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
scope_object_store = { workspace = true, features = ["test-support"] }
scope_postgres = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
