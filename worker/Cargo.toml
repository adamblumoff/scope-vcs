[package]
name = "worker"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/adamblumoff/scope-vcs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
base64 = "0.22.1"
getrandom = "0.3.4"
hex = "0.4.3"
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
scope_postgres = { package = "scope-postgres", path = "../crates/scope-postgres" }
scope_api_contract = { package = "scope-api-contract", path = "../crates/scope-api-contract" }
scope_domain = { package = "scope-domain", path = "../crates/scope-domain" }
scope_content_lifecycle = { package = "scope-content-lifecycle", path = "../crates/scope-content-lifecycle" }
scope_git = { package = "scope-git", path = "../crates/scope-git" }
scope_object_store = { package = "scope-object-store", path = "../crates/scope-object-store" }
scope_git_process = { package = "scope-git-process", path = "../crates/scope-git-process" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
